<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bảo tàng</title>
<link rel="stylesheet" href="./style.css">
</head>

<body>

<!-- NỀN ANIMATE -->
<div class="bg-art"></div>

<!-- HEADER -->
<div class="banner">
  <img src="./bia.jpg">

  <div class="overlay">
    <h1>🏛️ BẢO TÀNG</h1>
    <p>Hệ thống thuyết minh tự động</p>
  </div>
</div>

<!-- CONTENT -->
<div class="container">

  <h2 class="section-title">Danh sách địa điểm</h2>

  <div class="grid" id="list"></div>

</div>

<!-- SCRIPT -->
<script src="./app.js"></script>

<script>
async function load() {
  const data = await getPlaces();
  const list = document.getElementById("list");

  // clear trước (tránh load trùng)
  list.innerHTML = "";

  data.forEach(item => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="card-img">
        <img src="${item.anhdaidien}" alt="">
        <div class="overlay-text">${item.tendiadiem}</div>
      </div>
    `;

    div.onclick = () => {
      localStorage.setItem("place_" + item.id, JSON.stringify(item));
      window.location.href = "detail.html?id=" + item.id;
    };

    list.appendChild(div);
  });
}

// chạy
load();
</script>

</body>
</html>
