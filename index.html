<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bảo tàng</title>
<link rel="stylesheet" href="./style.css">
</head>

<body>

<!-- NỀN ANIMATE -->
<div class="bg-art"></div>

<!-- HEADER -->
<div class="banner">
  <img src="./bia.jpg">
  <div class="overlay">
    <h1>🏛️ BẢO TÀNG</h1>
    <p>Hệ thống thuyết minh tự động</p>
  </div>
</div>

<!-- CONTENT -->
<div class="container">

  <div class="content-wrap">

    <div class="section-header">
      <h2>Danh sách địa điểm</h2>
    <input id="search" class="search-box" placeholder="🔍 Tìm địa điểm...">
    </div>

    <div class="grid" id="list"></div>

  </div>

</div>

  <!-- LIST -->
  <div class="grid" id="list"></div>

</div>

<script src="./app.js"></script>

<script>
let allData = [];

async function load() {
  allData = await getPlaces();
  renderList(allData);
}

function renderList(data) {
  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(item => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="card-img">
        <img src="${item.anhdaidien}">
        <div class="overlay-text">${item.tendiadiem}</div>
      </div>
    `;

    div.onclick = () => {
      localStorage.setItem("place_" + item.id, JSON.stringify(item));
      window.location.href = "detail.html?id=" + item.id;
    };

    list.appendChild(div);
  });
}

/* SEARCH */
document.getElementById("search").oninput = (e) => {
  const keyword = e.target.value.toLowerCase();

  const filtered = allData.filter(item =>
    item.tendiadiem.toLowerCase().includes(keyword)
  );

  renderList(filtered);
};

load();
</script>

</body>
</html>
